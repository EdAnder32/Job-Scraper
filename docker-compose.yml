
services:
  ollama:
    image: ollama/ollama:latest
    container_name: vagas-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - vagas_net

  ollama-init:
    image: ollama/ollama:latest
    container_name: vagas-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
    networks:
      - vagas_net
    restart: "no"

  scraper:
    build: .
    container_name: vagas-scraper
    init: true
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true
    networks:
      - vagas_net

networks:
  vagas_net:
    driver: bridge

volumes:
  ollama_data:

